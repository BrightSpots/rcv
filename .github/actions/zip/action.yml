name: "Create zip of a directory"
description: "Cross-platform helper: creates a zip archive"

inputs:
  input:
    description: "The input file path"
    required: true
  command:
    description: "The command to run first"
    required: true
  zipFilename:
    description: "The output filename"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Run pre-command"
      shell: bash
      run: ${{ inputs.command }}

    - name: "Generate zip for Linux/Mac"
      if: runner.os == 'Linux' || runner.os == 'MacOS'
      shell: bash
      run: zip -r ${{inputs.zipFilename}} ${{inputs.input}}

    - name: "Generate zip for Windows"
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $inputPath = "${{inputs.input}}"
        # Git Bash on Windows emits Unix-style paths like /c/Users/... instead of C:\Users\...
        if ($inputPath -match '^/([a-zA-Z])/(.+)$') {
            # Convert /c/some/path -> C:\some\path
            $inputPath = $Matches[1].ToUpper() + ':' + ($Matches[2] -replace '/', '\')
        } else {
            # Expand ~ since PowerShell cmdlets don't resolve it in string arguments
            $inputPath = $inputPath -replace '^~', $HOME
        }
        Compress-Archive -Path $inputPath -Destination ${{inputs.zipFilename}}
